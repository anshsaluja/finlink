name: Repair Go dependency and formatting baseline

on:
  push:
    branches: [fix/go-ci-foundation]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Generate verified module checksums and format Go sources
        run: |
          go mod tidy
          find cmd internal -type f -name '*.go' -print0 | xargs -0 -r gofmt -w
          go mod verify
          go test ./...
          go vet ./...
      - name: Commit verified repairs on the dedicated feature branch
        run: |
          if [ -z "$(git status --porcelain -- go.mod go.sum cmd internal)" ]; then
            echo "No Go repairs needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add go.mod go.sum cmd internal
          git commit -m "fix: generate Go checksums and format verified sources"
          git push origin HEAD:fix/go-ci-foundation
